server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql:///orders_db?cloudSqlInstance=project-abbbaa96-84e3-4202-a12:us-central1:free-trial-first-project&socketFactory=com.google.cloud.sql.mysql.SocketFactory
    username: kafkauser
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: bootstrap.kafka.us-central1.managedkafka.project-abbbaa96-84e3-4202-a12.cloud.goog:9092
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: OAUTHBEARER
      sasl.jaas.config: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
      sasl.login.callback.handler.class: com.google.cloud.hosted.kafka.auth.GcpLoginCallbackHandler
    consumer:
      group-id: springkafka-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.spring.kafka.LearningSpringKafka.dto"
        spring.json.value.default.type: com.spring.kafka.LearningSpringKafka.dto.OrderEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      

app:
  kafka:
    topic: order-events

management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 30s
    tracing:
      endpoint: http://localhost:4318/v1/traces
  metrics:
    tags:
      application: springkafka
  tracing:
    sampling:
      probability: 1.0   # sample everything in dev; lower (e.g. 0.1) in production    