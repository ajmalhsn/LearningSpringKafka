server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql:///orders_db?cloudSqlInstance=project-abbbaa96-84e3-4202-a12:us-central1:free-trial-first-project&socketFactory=com.google.cloud.sql.mysql.SocketFactory
    username: kafkauser
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: bootstrap.kafka.us-central1.managedkafka.project-abbbaa96-84e3-4202-a12.cloud.goog:9092
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: OAUTHBEARER
      sasl.jaas.config: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
      sasl.login.callback.handler.class: com.google.cloud.hosted.kafka.auth.GcpLoginCallbackHandler
    consumer:
      group-id: springkafka-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  kafka:
    topic: order-events